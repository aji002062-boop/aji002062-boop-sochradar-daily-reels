name: SochRadar Daily Trading Reel
on:
  schedule:
    - cron: '30 18 * * *'
      timezone: 'Asia/Kolkata'
  workflow_dispatch:
    inputs:
      demo:
        description: 'Safe demo only; NEVER publishes'
        type: boolean
        required: false
        default: true

concurrency:
  group: sochradar-daily-one-reel
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  make-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      IG_PAGE_ACCESS_TOKEN: ${{ secrets.IG_PAGE_ACCESS_TOKEN }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      META_API_VERSION: 'v25.0'
      AUTO_PUBLISH: ${{ vars.AUTO_PUBLISH || 'false' }}
      DRIVE_ENABLED: ${{ vars.DRIVE_ENABLED || 'false' }}
      RCLONE_CONFIG_B64: ${{ secrets.RCLONE_CONFIG_B64 }}
      RCLONE_CONFIG_FILE: /tmp/sochradar-rclone.conf
      DEMO: ${{ github.event_name == 'workflow_dispatch' && inputs.demo || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install free render tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core rclone
          python -m pip install -r requirements.txt
      - name: Restore Drive OAuth config (encrypted secret)
        env:
          BASE64_TOKEN: ${{ secrets.RCLONE_CONFIG_B64 }}
        run: |
          if [ -n "$BASE64_TOKEN" ]; then
            printf '%s' "$BASE64_TOKEN" | base64 --decode > "$RCLONE_CONFIG_FILE"
            chmod 600 "$RCLONE_CONFIG_FILE"
          fi
      - name: Build video / Backup / Optional publish
        shell: bash
        run: |
          if [ "$DEMO" = 'true' ]; then
            python run.py --demo
          else
            python run.py
          fi
      - name: Downloadable evidence for testing and failed uploads
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sochradar-reel-result
          path: |
            output/**/reel.mp4
            output/**/post_caption.txt
            output/**/source_links.txt
            output/**/status.json
            output/**/content.json
          if-no-files-found: ignore
          retention-days: 7
